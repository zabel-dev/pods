services:

  postgres:
    image: postgres:16
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: db
      POSTGRES_PASSWORD: pass
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    ports:
      - "80:80"
    extra_hosts:
      # Lets nginx reach the host machine (Windows/macOS; works in Docker Desktop)
      - "host.docker.internal:host-gateway"
    volumes:
      - nginx-logs:/var/log/nginx

  # Built frontend + FastAPI + nginx in one container (API on 127.0.0.1:8000, nginx on $PORT, default 80).
  web:
    build:
      context: .
      dockerfile: Dockerfile.combined
    container_name: web
    restart: unless-stopped
    ports:
      - "3080:80"
    env_file:
      - .env
    environment:
      PORT: "80"
      RUN_UNIFIED: "1"
    depends_on:
      - postgres

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.3.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.3.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      # Nginx access/error logs (if you enable them)
      - nginx-logs:/var/log/nginx
    depends_on:
      - loki

volumes:
  grafana-data:
  loki-data:
  nginx-logs: