<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Субтитры из YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #e8eaed;
      --text: #1a1a1a;
      --text-muted: #5f6368;
      --accent: #1a73e8;
      --accent-hover: #1557b0;
      --success: #e6f4ea;
      --error-bg: #fce8e6;
      --error-text: #c5221f;
      --shadow: 0 1px 3px rgba(0,0,0,.06);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.25rem 0;
      color: var(--text);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9375rem;
      margin-bottom: 1.75rem;
    }

    .form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    input[type="url"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font: inherit;
      font-size: 0.9375rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s;
    }

    input[type="url"]::placeholder {
      color: var(--text-muted);
    }

    input[type="url"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input[type="checkbox"] {
      width: 1.125rem;
      height: 1.125rem;
      accent-color: var(--accent);
    }

    button {
      padding: 0.75rem 1.5rem;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text);
      min-height: 120px;
    }

    .result.placeholder {
      color: var(--text-muted);
    }

    .result.error {
      background: var(--error-bg);
      border-color: #f5c6cb;
      color: var(--error-text);
    }

    .result.success {
      background: var(--success);
      border-color: #b7e1cd;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Субтитры из YouTube</h1>
    <p class="subtitle">Вставьте ссылку на видео — получите субтитры с таймкодами.</p>

    <form class="form" id="form">
      <label for="url">Ссылка на видео</label>
      <input
        type="url"
        id="url"
        name="url"
        placeholder="https://www.youtube.com/watch?v=..."
        required
        autocomplete="off"
      />
      <div class="row">
        <label class="checkbox-wrap">
          <input type="checkbox" id="plainText" name="plain_text" />
          Только текст (без таймкодов)
        </label>
        <button type="submit" id="submit">Получить субтитры</button>
      </div>
    </form>

    <div class="result placeholder" id="result" aria-live="polite">
      Результат появится здесь.
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const urlInput = document.getElementById('url');
    const plainTextCheckbox = document.getElementById('plainText');
    const submitBtn = document.getElementById('submit');
    const resultEl = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;

      resultEl.textContent = 'Загрузка…';
      resultEl.className = 'result placeholder';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/subtitles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url,
            plain_text: plainTextCheckbox.checked
          })
        });

        const text = await res.text();

        if (!res.ok) {
          let msg = text;
          try {
            const j = JSON.parse(text);
            if (j.detail) msg = typeof j.detail === 'string' ? j.detail : j.detail.join?.(' ') || text;
          } catch (_) {}
          resultEl.textContent = msg;
          resultEl.className = 'result error';
          return;
        }

        resultEl.textContent = text || 'Субтитры не найдены.';
        resultEl.className = 'result success';
      } catch (err) {
        resultEl.textContent = 'Ошибка: ' + (err.message || 'нет связи с сервером');
        resultEl.className = 'result error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
